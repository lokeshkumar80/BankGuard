<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BankGuard{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1420;
            --panel: #171e2e;
            --border: #273148;
            --text: #e6ebf5;
            --muted: #8b96ab;
            --accent: #3b82f6;
            --danger: #ef4444;
            --safe: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.02em; }
        nav .brand span { color: var(--accent); }
        nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        nav a:hover { color: var(--text); }
        main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.4rem; margin-top: 0; }
        h2 { font-size: 1.05rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0c1120;
            color: var(--text);
            font-size: 0.95rem;
        }
        button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { color: var(--muted); font-weight: 600; }
        .badge { padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge.safe { background: rgba(34, 197, 94, 0.15); color: var(--safe); }
        .error { color: var(--danger); font-size: 0.88rem; margin-top: 10px; }
        .muted { color: var(--muted); }
        img.qr { background: white; padding: 12px; border-radius: 8px; margin-top: 12px; }
        code { background: #0c1120; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav>
        <div class="brand">Bank<span>Guard</span></div>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
